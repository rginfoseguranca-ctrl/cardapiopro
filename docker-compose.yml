version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - app-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      - CORS_ORIGIN=${CORS_ORIGIN:?Defina CORS_ORIGIN no arquivo .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
    driver: local
